<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Same CSP as index.html. frame-ancestors cannot be set from a meta tag on GitHub Pages. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Page not found | Northlink</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" focusable="false" width="0" height="0">
    <defs>
      <linearGradient id="mark-grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0" class="mark-stop-a"/>
        <stop offset="1" class="mark-stop-b"/>
      </linearGradient>
      <symbol id="mark" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="8" fill="url(#mark-grad)"/>
        <path d="M9.5 22.5V9.5L22.5 22.5V9.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="9.5" cy="9.5" r="2.4" fill="#fff"/>
        <circle cx="22.5" cy="22.5" r="2.4" fill="#fff"/>
      </symbol>
    </defs>
  </svg>

  <header class="site-header">
    <div class="wrap nav-bar">
      <a class="logo" href="/" aria-label="Northlink home">
        <svg class="logo-mark" width="32" height="32" aria-hidden="true" focusable="false"><use href="#mark"/></svg>
        <span class="logo-text">
          <span class="brand-name">Northlink</span>
          <span class="logo-sub">a Mado Digital company</span>
        </span>
      </a>
    </div>
  </header>

  <main id="main" class="lost">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="wrap">
      <svg class="lost-art" viewBox="0 0 340 120" role="img" aria-labelledby="lost-title">
        <title id="lost-title">Diagram: a connected node, and a dashed link leading to an empty spot where a page should be.</title>
        <defs>
          <linearGradient id="hub-grad-404" x1="-30" y1="-30" x2="30" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0" class="mark-stop-a"/>
            <stop offset="1" class="mark-stop-b"/>
          </linearGradient>
        </defs>
        <line class="link" x1="74" y1="60" x2="134" y2="60"/>
        <line class="link-broken" x1="206" y1="60" x2="266" y2="60"/>
        <g transform="translate(48 60)">
          <circle class="node-bg" r="24"/>
          <path class="node-icon" transform="translate(-12 -12)" d="M5.5 6h13a1 1 0 0 1 1 1v8.5h-15V7a1 1 0 0 1 1-1zM2.5 18.5h19"/>
        </g>
        <g transform="translate(170 60)">
          <circle r="34" fill="url(#hub-grad-404)"/>
          <path class="hub-icon" transform="translate(-15.6 -15.6) scale(1.3)" d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6z"/>
        </g>
        <g transform="translate(292 60)">
          <circle class="node-missing" r="24"/>
          <text class="q" x="0" y="6" text-anchor="middle">?</text>
        </g>
      </svg>
      <p class="eyebrow lost-code">Error 404 <span class="sep" aria-hidden="true">/</span> Not found</p>
      <h1 class="hero-title">There's nothing at this address.</h1>
      <p class="lead">The link may be old, or the page may have moved.</p>
      <a class="btn btn-primary btn-lg" href="/">Go to the homepage</a>
      <p class="lost-contact">Or email us at <a href="mailto:kiowa@madodigital.net">kiowa@madodigital.net</a>.</p>
    </div>
  </main>
</body>
</html>

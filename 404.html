<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Same CSP as index.html. frame-ancestors cannot be set from a meta tag on GitHub Pages. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Page not found | Northlink</title>
  <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0D11" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/brand/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/assets/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="brand" href="/">
        <picture class="brand-logo">
          <source srcset="/assets/brand/logo-mn-horizontal-dark.svg" media="(prefers-color-scheme: dark)">
          <img src="/assets/brand/logo-mn-horizontal.svg" alt="Northlink" width="157" height="32">
        </picture>
        <span class="brand-sub">a Mado Digital company</span>
      </a>
    </div>
  </header>

  <main id="main" class="lost" tabindex="-1">
    <div class="container">
      <picture class="lost-mark">
        <source srcset="/assets/brand/mark-mn-dark.svg" media="(prefers-color-scheme: dark)">
        <img src="/assets/brand/mark-mn.svg" alt="" width="42" height="56">
      </picture>
      <p class="eyebrow">Error 404</p>
      <h1 class="h1">This page doesn't exist</h1>
      <p class="lead">The link may be old, or the page may have moved.</p>
      <div class="hero-ctas">
        <a class="btn btn--primary" href="/">Go to the homepage</a>
        <a class="btn btn--secondary" href="mailto:kiowa@madodigital.net">Email us</a>
      </div>
    </div>
  </main>
</body>
</html>
